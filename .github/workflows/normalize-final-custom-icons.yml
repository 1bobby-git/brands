name: Normalize final custom integration icons

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/normalize-final-custom-icons.yml

permissions:
  contents: write

concurrency:
  group: normalize-final-custom-integration-icons
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B normalize-icons origin/master

      - name: Install image tooling
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Normalize icons and generate high-density variants
        shell: bash
        run: |
          set -euo pipefail
          # Source PNG blobs were repaired before this one-shot normalization run.
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("custom_integrations")
          for domain in ("smartthings_web", "smartthings_find", "kepco_on"):
              directory = root / domain
              source = directory / "icon.png"
              image = Image.open(source).convert("RGBA")
              if image.size != (256, 256):
                  raise SystemExit(f"{domain}/icon.png has unexpected size: {image.size}")
              minimum, maximum = image.getchannel("A").getextrema()
              if minimum != 0 or maximum != 255:
                  raise SystemExit(
                      f"{domain}/icon.png lacks full transparency range: {(minimum, maximum)}"
                  )
              image.save(source, format="PNG", optimize=True, compress_level=9)
              image.resize((512, 512), Image.Resampling.LANCZOS).save(
                  directory / "icon@2x.png",
                  format="PNG",
                  optimize=True,
                  compress_level=9,
              )

          for domain in ("smartthings_web", "smartthings_find", "kepco_on"):
              directory = root / domain
              for name, expected in (("icon.png", (256, 256)), ("icon@2x.png", (512, 512))):
                  image = Image.open(directory / name)
                  if image.mode != "RGBA":
                      raise SystemExit(f"{domain}/{name} is not RGBA: {image.mode}")
                  if image.size != expected:
                      raise SystemExit(f"{domain}/{name} has unexpected size: {image.size}")
                  minimum, maximum = image.getchannel("A").getextrema()
                  if minimum != 0 or maximum != 255:
                      raise SystemExit(
                          f"{domain}/{name} lacks full transparency range: {(minimum, maximum)}"
                      )
          PY
          git diff --check

      - name: Commit normalized icons
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-final-custom-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize SmartThings and KEPCO ON icons as RGBA PNG"
          git push origin HEAD:master
