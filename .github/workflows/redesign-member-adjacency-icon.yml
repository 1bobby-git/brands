name: Redesign Member Adjacency icon

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/redesign-member-adjacency-icon.yml

permissions:
  contents: write

concurrency:
  group: redesign-member-adjacency-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg Pillow

      - name: Render redesigned icon assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg
          import shutil

          svg = r'''<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="tile" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
                <stop offset="0" stop-color="#8A36FF"/>
                <stop offset="0.30" stop-color="#3152F5"/>
                <stop offset="0.66" stop-color="#087FEF"/>
                <stop offset="1" stop-color="#18E3D2"/>
              </linearGradient>
              <radialGradient id="shine" cx="0.82" cy="0.12" r="0.78">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
                <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.04"/>
                <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
              </radialGradient>
              <linearGradient id="whitePin" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFFFFF"/>
                <stop offset="0.58" stop-color="#F7FBFF"/>
                <stop offset="1" stop-color="#CFE4FF"/>
              </linearGradient>
              <linearGradient id="blueCore" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#10CBFF"/>
                <stop offset="0.55" stop-color="#1765F1"/>
                <stop offset="1" stop-color="#2732C9"/>
              </linearGradient>
              <linearGradient id="greenCore" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22F2B4"/>
                <stop offset="0.58" stop-color="#05B978"/>
                <stop offset="1" stop-color="#06875F"/>
              </linearGradient>
              <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#E4EDF7"/>
              </linearGradient>
              <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#07143E" flood-opacity="0.34"/>
              </filter>
              <filter id="pinShadow" x="-60%" y="-50%" width="220%" height="240%">
                <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071B53" flood-opacity="0.35"/>
              </filter>
              <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="18"/>
              </filter>
              <clipPath id="tileClip">
                <rect x="70" y="70" width="884" height="884" rx="205"/>
              </clipPath>
            </defs>

            <rect x="70" y="70" width="884" height="884" rx="205" fill="url(#tile)" filter="url(#tileShadow)"/>
            <g clip-path="url(#tileClip)">
              <rect x="70" y="70" width="884" height="884" rx="205" fill="url(#shine)"/>
              <circle cx="516" cy="523" r="164" fill="none" stroke="#7FF6FF" stroke-width="9" opacity="0.24"/>
              <circle cx="516" cy="523" r="278" fill="none" stroke="#7FF6FF" stroke-width="10" opacity="0.22"/>
              <circle cx="516" cy="523" r="392" fill="none" stroke="#9AEAFF" stroke-width="11" opacity="0.20"/>
              <path d="M123 251 C310 89 637 63 866 190" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.09"/>
              <path d="M128 789 C320 942 712 954 904 737" fill="none" stroke="#0B2EBE" stroke-width="24" stroke-linecap="round" opacity="0.10"/>
            </g>

            <ellipse cx="352" cy="775" rx="188" ry="78" fill="#73F7FF" opacity="0.18" filter="url(#softGlow)"/>
            <ellipse cx="352" cy="775" rx="144" ry="52" fill="none" stroke="#8FFFFF" stroke-width="18" opacity="0.65"/>
            <ellipse cx="352" cy="775" rx="82" ry="28" fill="#146BFF" opacity="0.42"/>

            <ellipse cx="704" cy="650" rx="132" ry="56" fill="#48FFC7" opacity="0.18" filter="url(#softGlow)"/>
            <ellipse cx="704" cy="650" rx="103" ry="38" fill="none" stroke="#7CFFD8" stroke-width="15" opacity="0.74"/>
            <ellipse cx="704" cy="650" rx="57" ry="20" fill="#00A96B" opacity="0.48"/>

            <path d="M446 724 C522 690 583 664 628 640" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 34" opacity="0.88"/>
            <path d="M494 493 A86 86 0 0 1 566 566" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.95"/>
            <path d="M511 442 A139 139 0 0 1 618 551" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.95"/>

            <g transform="translate(344 548)" filter="url(#pinShadow)">
              <path d="M0 -178 C-111 -178 -196 -96 -196 14 C-196 139 -64 278 0 342 C64 278 196 139 196 14 C196 -96 111 -178 0 -178 Z" fill="url(#whitePin)"/>
              <circle cx="0" cy="6" r="150" fill="url(#blueCore)"/>
              <circle cx="0" cy="6" r="150" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.78"/>
              <circle cx="0" cy="-48" r="48" fill="url(#person)"/>
              <path d="M-91 95 C-83 30 -45 4 0 4 C45 4 83 30 91 95 C58 120 -58 120 -91 95 Z" fill="url(#person)"/>
              <path d="M-116 -84 C-52 -154 59 -157 125 -88" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.28"/>
            </g>

            <g transform="translate(703 406) scale(0.72)" filter="url(#pinShadow)">
              <path d="M0 -178 C-111 -178 -196 -96 -196 14 C-196 139 -64 278 0 342 C64 278 196 139 196 14 C196 -96 111 -178 0 -178 Z" fill="url(#whitePin)"/>
              <circle cx="0" cy="6" r="150" fill="url(#greenCore)"/>
              <circle cx="0" cy="6" r="150" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.78"/>
              <circle cx="0" cy="-48" r="48" fill="url(#person)"/>
              <path d="M-91 95 C-83 30 -45 4 0 4 C45 4 83 30 91 95 C58 120 -58 120 -91 95 Z" fill="url(#person)"/>
              <path d="M-116 -84 C-52 -154 59 -157 125 -88" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.28"/>
            </g>

            <path d="M828 343 A74 74 0 0 1 877 406" fill="none" stroke="#B7FFE6" stroke-width="19" stroke-linecap="round"/>
            <path d="M850 307 A119 119 0 0 1 927 400" fill="none" stroke="#E7FFF6" stroke-width="19" stroke-linecap="round"/>
          </svg>'''

          target = Path("custom_integrations/member_adjacency")
          target.mkdir(parents=True, exist_ok=True)

          for name, size in (("icon.png", 256), ("icon@2x.png", 512)):
              output = target / name
              cairosvg.svg2png(
                  bytestring=svg.encode("utf-8"),
                  write_to=str(output),
                  output_width=size,
                  output_height=size,
              )
              image = Image.open(output).convert("RGBA")
              image.save(output, format="PNG", optimize=True, compress_level=9)

          shutil.copyfile(target / "icon.png", target / "dark_icon.png")
          shutil.copyfile(target / "icon@2x.png", target / "dark_icon@2x.png")

          expected = {
              "icon.png": (256, 256),
              "dark_icon.png": (256, 256),
              "icon@2x.png": (512, 512),
              "dark_icon@2x.png": (512, 512),
          }
          for name, size in expected.items():
              image = Image.open(target / name).convert("RGBA")
              if image.size != size:
                  raise SystemExit(f"Unexpected size for {name}: {image.size}")
              if image.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Missing transparency in {name}")
          PY

          git diff --check

      - name: Commit redesigned assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/redesign-member-adjacency-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Member Adjacency icon"
          git push origin HEAD:master
