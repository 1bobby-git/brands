name: Generate KEPCO ON brand assets

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/generate-kepco-on-brand.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: true

      - name: Install image dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pillow numpy

      - name: Generate transparent KEPCO ON icon and logo
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://online.kepco.co.kr/cm/images/img-navi-logo.png"
          source_file="$(mktemp --suffix=.png)"
          trap 'rm -f "$source_file"' EXIT
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 20 "$source_url" --output "$source_file"
          echo "8ae8f0677dad673c4691cdd514db121ff684a2d25bf8d2c81e77e51939d8a16c  $source_file" | sha256sum --check --strict

          SOURCE_FILE="$source_file" python <<'PY'
          from pathlib import Path
          import os
          import numpy as np
          from PIL import Image, ImageOps

          source_path = Path(os.environ["SOURCE_FILE"])
          target = Path("custom_integrations/kepco_on")
          target.mkdir(parents=True, exist_ok=True)

          source = Image.open(source_path).convert("RGBA")
          if source.size != (1446, 327):
              raise SystemExit(f"Unexpected source dimensions: {source.size}")

          alpha = source.getchannel("A")
          full_bbox = alpha.getbbox()
          if full_bbox != (7, 5, 1439, 320):
              raise SystemExit(f"Unexpected visible bounds: {full_bbox}")

          full = source.crop(full_bbox)
          width, height = full.size
          target_width = width + (width % 2)
          target_height = height + (height % 2)
          logo_2x = Image.new("RGBA", (target_width, target_height), (0, 0, 0, 0))
          logo_2x.alpha_composite(full, ((target_width - width) // 2, (target_height - height) // 2))
          logo = logo_2x.resize((target_width // 2, target_height // 2), Image.Resampling.LANCZOS)

          # Exact visible bounds of the red left-hand "o"/plug-face mark.
          o_bbox = (755, 28, 1074, 319)
          o_crop = source.crop(o_bbox)
          o_array = np.array(o_crop)
          local_alpha = o_array[:, :, 3]
          local_r = o_array[:, :, 0].astype(np.int16)
          local_g = o_array[:, :, 1].astype(np.int16)
          local_b = o_array[:, :, 2].astype(np.int16)
          red_hued = (
              (local_alpha > 0)
              & (local_r > local_g * 1.25)
              & (local_r > local_b * 1.25)
          )
          o_array[~red_hued, 3] = 0
          o_crop = Image.fromarray(o_array, "RGBA")

          def make_square_icon(image: Image.Image, size: int, margin_ratio: float = 0.047) -> Image.Image:
              margin = max(1, round(size * margin_ratio))
              contained = ImageOps.contain(
                  image,
                  (size - margin * 2, size - margin * 2),
                  Image.Resampling.LANCZOS,
              )
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(
                  contained,
                  ((size - contained.width) // 2, (size - contained.height) // 2),
              )
              return canvas

          icon_2x = make_square_icon(o_crop, 512)
          icon = icon_2x.resize((256, 256), Image.Resampling.LANCZOS)

          assets = {
              "icon.png": icon,
              "icon@2x.png": icon_2x,
              "logo.png": logo,
              "logo@2x.png": logo_2x,
          }
          for name, image in assets.items():
              quantized = image.quantize(
                  colors=256,
                  method=Image.Quantize.FASTOCTREE,
                  dither=Image.Dither.NONE,
              )
              quantized.save(target / name, optimize=True, compress_level=9)
          PY

          sha256sum --check --strict <<'SUMS'
          ed6a7810932b858f71aee1231229780f1ac682baa2db604cb83940844eb1638f  custom_integrations/kepco_on/icon.png
          8ae1cc6f247ca923376ecf84d3765322e31a85ede94218d12ae94329b2efa26e  custom_integrations/kepco_on/icon@2x.png
          f77db7ed9fbb5e203d5ed87180e2c3153083913873e7f750b1a055f800e79833  custom_integrations/kepco_on/logo.png
          6d4b2d148261af775b16d8d1db1f393b0bd9d397a37fd23310943aaa94a4152b  custom_integrations/kepco_on/logo@2x.png
          SUMS
          git diff --check

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_integrations/kepco_on/icon.png custom_integrations/kepco_on/icon@2x.png custom_integrations/kepco_on/logo.png custom_integrations/kepco_on/logo@2x.png
          if git diff --cached --quiet; then
            echo "KEPCO ON assets are already current."
            exit 0
          fi
          git commit -m "Add KEPCO ON brand assets"
          git push origin HEAD:master
